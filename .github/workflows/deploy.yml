name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Speech clips are build output. Keep them between runs so only new or
      # changed text is synthesized; the generator itself decides what is
      # still valid (provider, voice and rate changes regenerate everything).
      - uses: actions/cache@v4
        with:
          path: public/audio
          key: marathi-audio-${{ vars.TTS_PROVIDER }}-${{ vars.TTS_VOICE }}-${{ hashFiles('src/data/**', 'scripts/generate-audio.mjs') }}
          restore-keys: |
            marathi-audio-${{ vars.TTS_PROVIDER }}-${{ vars.TTS_VOICE }}-
      # With no credentials configured this only warns, and the app falls back
      # to the device's own Marathi voice. Empty values count as unset.
      - run: npm run audio
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
