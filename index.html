<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>मराठी शिका · Learn Marathi</title>

    <link rel="canonical" href="https://extinctmushroom.github.io/Marathi/" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="मराठी शिका · Learn Marathi" />
    <meta property="og:url" content="https://extinctmushroom.github.io/Marathi/" />
    <meta property="og:title" content="मराठी शिका · Learn Marathi" />
    <meta
      property="og:description"
      content="A complete, free interactive course — learn Marathi from the Devanagari script to real conversation. 7 levels, 43 lessons, flashcards, quizzes, and spaced-repetition review. No signup."
    />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="मराठी शिका — Learn Marathi, from the Devanagari script to real conversation." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="मराठी शिका · Learn Marathi" />
    <meta
      name="twitter:description"
      content="A complete, free interactive course — learn Marathi from the Devanagari script to real conversation. No signup."
    />
    <meta name="twitter:image" content="https://extinctmushroom.github.io/Marathi/og-image.png" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%238E2A5C'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle' fill='%23FAF3E6' font-family='serif'%3E%E0%A4%AE%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:ital@0;1&family=Karla:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Installable PWA · works offline -->
    <meta name="theme-color" content="#8E2A5C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="मराठी शिका" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />

    <!-- Capture anything that goes wrong before the app mounts, so the
         loading screen can report it instead of just sitting there. -->
    <script>
      window.__bootErrors = [];
      window.addEventListener(
        "error",
        function (e) {
          try {
            window.__bootErrors.push(
              (e.message || "error") + (e.lineno ? " (line " + e.lineno + ")" : "")
            );
          } catch (_) {}
        },
        true
      );
      window.addEventListener("unhandledrejection", function (e) {
        try {
          var r = e.reason;
          window.__bootErrors.push("promise: " + ((r && r.message) || String(r)));
        } catch (_) {}
      });
    </script>

    <!-- Resolve the theme before first paint so dark-mode users never see a light flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("marathi-shika-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
          if (t === "dark") {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#2a0e1d");
          }
        } catch (e) {
          /* no storage — fall back to the CSS media query */
        }
      })();
    </script>
  </head>
  <body>
    <!-- Replaced by React on mount. If this text is still visible, the app
         bundle never executed (blocked, 404, or an unsupported browser). -->
    <div id="root">
      <div
        id="boot"
        style="
          font-family: Karla, system-ui, sans-serif;
          max-width: 34rem;
          margin: 18vh auto 0;
          padding: 0 1.5rem;
          text-align: center;
          color: #6b5573;
        "
      >
        <div style="font-size: 2.5rem; color: #8e2a5c">मराठी शिका</div>
        <p style="margin-top: 0.75rem">Loading the course…</p>
        <noscript>
          <p style="color: #a53939">
            This course needs JavaScript enabled to run.
          </p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Browser can't run ES modules at all. -->
    <script nomodule>
      (function () {
        var b = document.getElementById("boot");
        if (b) {
          b.innerHTML =
            '<div style="font-size:2.5rem;color:#8e2a5c">मराठी शिका</div>' +
            '<p style="color:#a53939">This browser is too old to run the course — it does not support JavaScript modules. Please try a current version of Safari, Chrome, Firefox, or Edge.</p>';
        }
      })();
    </script>

    <!-- If React still hasn't mounted after a few seconds, the bundle was
         blocked or never arrived. Say so instead of spinning forever. -->
    <script>
      (function () {
        var mounted = function () {
          var b = document.getElementById("boot");
          return !b || !document.body.contains(b);
        };

        // Some networks and devices strip large inline <script>/<style>
        // blocks. The same code also ships as a file, so if the inline copy
        // is missing or didn't run, try that route before giving up.
        var loadFromFile = function (done) {
          var style = document.getElementById("app-style");
          if (!style || style.textContent.length < 1000) {
            var link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = "./assets/style.css";
            document.head.appendChild(link);
          }
          var s = document.createElement("script");
          s.src = "./assets/index.js";
          s.onerror = function () {
            window.__bootErrors.push("fallback file blocked too");
            done();
          };
          s.onload = function () {
            setTimeout(done, 400);
          };
          document.body.appendChild(s);
        };

        var report = function () {
          var b = document.getElementById("boot");
          if (!b || !document.body.contains(b)) return;
          var p = b.getElementsByTagName("p")[0];
          if (!p) return;
          p.innerHTML =
            "The course didn't finish loading.<br><br>" +
            "A reload usually fixes it. If it keeps happening, a browser shield, " +
            "ad blocker, or content filter may be blocking the page's script.";
          p.style.color = "#a53939";
          p.style.lineHeight = "1.5";

          // Details worth including in a bug report.
          try {
            var info = document.createElement("pre");
            info.style.cssText =
              "text-align:left;white-space:pre-wrap;word-break:break-word;background:#f4e9d2;" +
              "border:1px solid #e5d7bc;border-radius:10px;padding:10px 12px;font-size:11px;" +
              "color:#33203b;margin-top:16px";
            var sw = "serviceWorker" in navigator ? (navigator.serviceWorker.controller ? "controlled" : "none") : "unsupported";
            var bundleEl = document.getElementById("app-bundle");
            var styleEl = document.getElementById("app-style");
            info.textContent =
              "url: " + location.href + "\n" +
              "serviceWorker: " + sw + "\n" +
              "html bytes: " + document.documentElement.outerHTML.length + "\n" +
              "bundle bytes: " + (bundleEl ? bundleEl.textContent.length : "MISSING") + "\n" +
              "style bytes: " + (styleEl ? styleEl.textContent.length : "MISSING") + "\n" +
              "readyState: " + document.readyState + "\n" +
              "errors: " + (window.__bootErrors.length ? window.__bootErrors.join(" | ") : "none") + "\n" +
              "ua: " + navigator.userAgent;
            b.appendChild(info);
          } catch (e) {
            /* diagnostics are best-effort */
          }
        };

        setTimeout(function () {
          if (mounted()) return;

          // Route 1: the code is in the page but didn't run — run it again.
          var bundle = document.getElementById("app-bundle");
          if (bundle && bundle.textContent && bundle.textContent.length > 1000) {
            try {
              (0, eval)(bundle.textContent);
            } catch (err) {
              window.__bootErrors.push("retry: " + (err && err.message ? err.message : err));
            }
            if (mounted()) return;
          } else {
            window.__bootErrors.push("inline bundle missing (stripped before delivery)");
          }

          // Route 2: load the same code as an ordinary file.
          loadFromFile(function () {
            if (mounted()) return;

            // Route 3: identical code under a neutral extension, for filters
            // that block by URL pattern rather than by content.
            if (!window.fetch) return report();
            fetch("./assets/app-style.txt")
              .then(function (r) {
                return r.ok ? r.text() : "";
              })
              .catch(function () {
                return "";
              })
              .then(function (css) {
                if (css) {
                  var st = document.createElement("style");
                  st.textContent = css;
                  document.head.appendChild(st);
                }
                return fetch("./assets/app.txt");
              })
              .then(function (r) {
                if (!r.ok) throw new Error("HTTP " + r.status);
                return r.text();
              })
              .then(function (code) {
                if (!code || code.length < 1000) throw new Error("empty payload");
                (0, eval)(code);
              })
              .catch(function (err) {
                window.__bootErrors.push("route3: " + (err && err.message ? err.message : err));
              })
              .then(function () {
                setTimeout(function () {
                  if (!mounted()) report();
                }, 400);
              });
          });
        }, 6000);
      })();
    </script>
  </body>
</html>
